[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 8

[browser]
gatherUsageStats = false

[runner]
fastReruns = false

[theme]
base = "light"
primaryColor = "#3157A4"
font = "sans serif"
